worker_processes 1;
error_log stderr;
pid /run/ordinary-muse-h5/nginx.pid;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    client_body_temp_path /run/ordinary-muse-h5/client;
    proxy_temp_path /run/ordinary-muse-h5/proxy;
    fastcgi_temp_path /run/ordinary-muse-h5/fastcgi;
    uwsgi_temp_path /run/ordinary-muse-h5/uwsgi;
    scgi_temp_path /run/ordinary-muse-h5/scgi;
    limit_req_zone $binary_remote_addr zone=score_feedback:1m rate=6r/m;
    server {
        listen 127.0.0.1:8782;
        server_name localhost;
        # Keep redirects relative so SSH/local previews retain their own host/port.
        absolute_redirect off;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
        client_max_body_size 500m;

        location = / { return 302 /score/$is_args$args; }
        location = /score { return 308 /score/$is_args$args; }
        location = /audio { return 308 /audio/$is_args$args; }

        # Preserve the feedback service's method/body/rate limits and client IP.
        location = /score/api/feedback {
            if ($request_method != POST) { return 405; }
            client_max_body_size 12k;
            client_body_timeout 10s;
            limit_req zone=score_feedback burst=6 nodelay;
            limit_req_status 429;
            proxy_connect_timeout 2s;
            proxy_read_timeout 12s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_pass http://127.0.0.1:8781/api/feedback;
        }
        location /score/api/ { return 404; }
        location /score/ {
            alias /srv/ordinary-muse-h5/paths-current/score/;
        }

        # Strip /audio/ at the gateway; native App and Mac API URLs stay unchanged.
        location /audio/api/ {
            proxy_pass http://127.0.0.1:8783/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_request_buffering off;
            proxy_read_timeout 620s;
            proxy_send_timeout 620s;
        }
        location /audio/ {
            alias /srv/ordinary-muse-h5/paths-current/audio/;
        }
        location / { return 404; }
    }
}

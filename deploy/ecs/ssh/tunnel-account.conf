# BEGIN ORDINARY MUSE TUNNEL ACCOUNT
Match User muse-tunnel
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    GSSAPIAuthentication no
    AuthorizedKeysFile /etc/ssh/authorized_keys/muse-tunnel
    AuthorizedKeysCommand none
    AllowTcpForwarding remote
    PermitListen 127.0.0.1:19000
    PermitOpen none
    GatewayPorts no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    PermitTunnel no
    PermitUserRC no
    MaxSessions 1
    ClientAliveInterval 30
    ClientAliveCountMax 3
    ForceCommand /usr/local/libexec/ordinary-muse-tunnel-command
Match all
# END ORDINARY MUSE TUNNEL ACCOUNT
